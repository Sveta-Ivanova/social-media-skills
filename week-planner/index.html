<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f6f2"><title>Моя неделя</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f6f2;color:#283448;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:1800px;margin:auto;padding:22px 14px 80px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}h1{font-size:30px;margin:0}#range{color:#65758a;margin:6px 0}button{font:inherit;cursor:pointer;border:0;border-radius:13px;background:#e7edf4;color:#34547b;padding:12px 15px}button:active{opacity:.7}.nav{display:flex;gap:6px}.day{border:1px solid #dbe1e9;border-radius:20px;background:white;margin:12px 0;overflow:hidden;min-height:115px}.day.over{outline:3px solid #6b9cd1}.dayhead{display:flex;align-items:center;justify-content:space-between;background:#edf2f7;padding:12px 16px;font-weight:700}.date{font-weight:400;color:#6c7b90;margin-left:8px}.add{background:white;font-size:23px;padding:4px 13px}.items{padding:12px;min-height:65px}.empty{color:#b0b8c4;padding:9px}.task{background:#f4f6fa;border:1px solid #e1e7ee;border-radius:12px;padding:11px;margin:7px 0;display:flex;align-items:center;gap:8px;touch-action:pan-y}.task.dragging{opacity:.45}.handle{touch-action:none;cursor:grab;color:#7187a0;padding:7px;font-size:22px;user-select:none}.tasktext{flex:1;overflow-wrap:anywhere;white-space:pre-wrap}.done .tasktext{text-decoration:line-through;color:#94a0af}.check{width:22px;height:22px;accent-color:#577da7}.small{padding:6px 8px;background:transparent;color:#75859a}.hint{font-size:13px;color:#728094;margin:14px 4px}dialog{border:0;border-radius:20px;padding:22px;width:min(92vw,430px);box-shadow:0 12px 60px #0003}dialog::backdrop{background:#18243477}textarea{font:inherit;width:100%;min-height:100px;border:1px solid #ccd6e1;border-radius:12px;padding:12px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:12px}#jump{font-size:14px}#parking{margin-top:25px}
@media(min-width:900px){#days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;align-items:start}.weekgroup{background:#fffaf4;border:1px solid #e4e1db;border-radius:20px;padding:12px}.weekgroup h2{font-size:19px;margin:4px 5px 12px}.weekgroup .day{margin:7px 0;min-height:80px}.weekgroup .items{min-height:35px;padding:6px 10px}.weekgroup .dayhead{padding:7px 12px}.weekgroup .empty{padding:4px}.weekgroup .task{margin:5px 0;padding:6px}}@media(max-width:899px){.weekgroup h2{font-size:19px;margin:22px 4px 8px}header{flex-wrap:wrap}}.weekgroup{min-width:0}.tasktext{min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;cursor:pointer;line-height:1.25}.handle,.check,.small{flex-shrink:0}.dayhead>div{min-width:0}.weekgroup .day{min-width:0}@media(min-width:900px){#days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:auto repeat(7,minmax(110px,auto));gap:8px 14px;align-items:stretch}.weekgroup{display:grid;grid-template-rows:subgrid;grid-row:1 / span 8;gap:8px; padding:8px;min-width:0}.weekgroup h2{margin:4px;align-self:center}.weekgroup .day{margin:0;min-height:110px;display:flex;flex-direction:column}.weekgroup .items{flex:1;min-height:0}.weekgroup .task{min-height:48px}.weekgroup .dayhead{flex-shrink:0}.weekgroup .empty{color:#a0a9b6}}.day:has(.task) .dayhead{background:#dce9df}#board{font:inherit;font-weight:700;color:#283448;background:#e7edf4;border:0;border-radius:10px;padding:8px 12px;margin:8px 0}</style><main><header><div><h1>Моя неделя</h1><select id="board" aria-label="Календарь"><option value="telegram">Телеграм</option><option value="instagram">Инстаграм</option><option value="excursions">Экскурсии</option><option value="youtube">Ютуб</option><option value="facebook">Фейсбук</option></select><div id="range"></div></div><div class="nav"><button id="prev" aria-label="Предыдущая неделя">‹</button><button id="today">Сегодня</button><button id="next" aria-label="Следующая неделя">›</button></div></header><button id="jump">Перейти к дате</button><input id="datepick" type="date" hidden><div id="days"></div><section class="day" id="parking"><div class="dayhead">Без даты <button class="add" data-add="none">+</button></div><div class="items" data-day="none"></div></section><p class="hint">Удерживай ⠿ и перетаскивай дела между днями любых четырёх недель. Для другой даты используй ✎.</p></main><dialog id="editor"><h2 id="editorTitle">Новое дело</h2><textarea id="entry" placeholder="Что нужно сделать?"></textarea><p>День: <select id="destination"></select></p><div class="actions"><button id="cancel">Отмена</button><button id="save">Сохранить</button></div></dialog><script>
const names=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];const months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];let board=localStorage.getItem('my-week-board')||'telegram';let key=board==='telegram'?'my-week-v1':'my-week-v1-'+board;let tasks=[];try{tasks=JSON.parse(localStorage.getItem(key)||'[]')}catch{};let week=start(new Date()),editing=null;const $=s=>document.querySelector(s);function start(d){d=new Date(d);d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d}function plus(d,n){let a=new Date(d);a.setDate(a.getDate()+n);return a}function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function fmt(d){return d.getDate()+' '+months[d.getMonth()]}function persist(){localStorage.setItem(key,JSON.stringify(tasks))}function make(tag,cls,txt){let e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function render(){let end=plus(week,27);$('#range').textContent=fmt(week)+' – '+fmt(end)+' '+end.getFullYear();let root=$('#days');root.replaceChildren();for(let w=0;w<4;w++){let group=make('section','weekgroup'),first=plus(week,w*7),last=plus(first,6);group.append(make('h2','',fmt(first)+' – '+fmt(last)));root.append(group);for(let j=0;j<7;j++){let i=w*7+j,d=plus(week,i),id=iso(d),card=make('section','day');card.dataset.day=id;let head=make('div','dayhead'),label=make('div');label.append(make('span','',names[d.getDay()]),make('span','date',fmt(d)));let add=make('button','add','+');add.onclick=()=>edit(null,id);head.append(label,add);let items=make('div','items');items.dataset.day=id;card.append(head,items);group.append(card);fill(items,id)}}fill($('#parking .items'),'none');installDrops()}function fill(root,id){root.replaceChildren();let list=tasks.filter(t=>t.day===id);if(!list.length)root.append(make('div','empty','Пока свободно'));for(let t of list){let card=make('div','task'+(t.done?' done':''));card.dataset.id=t.id;let handle=make('span','handle','⠿');handle.setAttribute('aria-label','Перетащить');let check=make('input','check');check.type='checkbox';check.checked=!!t.done;check.onchange=()=>{t.done=check.checked;persist();render()};let txt=make('span','tasktext',t.text);txt.onclick=()=>edit(t.id);txt.title=t.text;txt.setAttribute('role','button');txt.tabIndex=0;txt.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();edit(t.id)}};let btn=make('button','small','✎');btn.onclick=()=>edit(t.id);card.append(handle,check,txt,btn);root.append(card);drag(handle,card,t)}}function edit(id,day){editing=id;let t=tasks.find(t=>t.id===id);$('#editorTitle').textContent=t?'Изменить дело':'Новое дело';$('#entry').value=t?.text||'';let sel=$('#destination');sel.replaceChildren();for(let i=-28;i<=55;i++){let d=plus(week,i),o=make('option','',names[d.getDay()]+' '+fmt(d));o.value=iso(d);sel.append(o)}let o=make('option','','Без даты');o.value='none';sel.append(o);sel.value=t?.day||day||iso(new Date());if(sel.selectedIndex<0){let extra=make('option','',t.day);extra.value=t.day;sel.append(extra);sel.value=t.day}$('#editor').showModal();$('#entry').focus()}$('#save').onclick=()=>{let text=$('#entry').value.trim();if(!text)return;if(editing){let t=tasks.find(t=>t.id===editing);t.text=text;t.day=$('#destination').value}else tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),text,day:$('#destination').value,done:false});persist();$('#editor').close();render()};$('#cancel').onclick=()=>$('#editor').close();$('#parking .add').onclick=()=>edit(null,'none');$('#prev').onclick=()=>{week=plus(week,-28);render()};$('#next').onclick=()=>{week=plus(week,28);render()};$('#today').onclick=()=>{week=start(new Date());render()};$('#jump').onclick=()=>$('#datepick').showPicker?$('#datepick').showPicker():$('#datepick').click();$('#datepick').onchange=e=>{if(e.target.value){week=start(new Date(e.target.value+'T12:00:00'));render()}};let dragging=null;function drag(handle,card,t){handle.addEventListener('pointerdown',e=>{e.preventDefault();dragging={t,id:e.pointerId,handle,card};handle.setPointerCapture(e.pointerId);card.classList.add('dragging')});handle.addEventListener('pointermove',e=>{if(!dragging||dragging.id!==e.pointerId)return;let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-day]');document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));if(el)el.closest('.day')?.classList.add('over');if(e.clientY>innerHeight-75)scrollBy(0,13);if(e.clientY<75)scrollBy(0,-13)});handle.addEventListener('pointerup',e=>{if(!dragging)return;let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-day]');if(el){t.day=el.dataset.day;persist()}dragging=null;render()});handle.addEventListener('pointercancel',()=>{dragging=null;render()})}function installDrops(){}$('#board').value=board;$('#board').onchange=()=>{board=$('#board').value;localStorage.setItem('my-week-board',board);key=board==='telegram'?'my-week-v1':'my-week-v1-'+board;try{tasks=JSON.parse(localStorage.getItem(key)||'[]')}catch{tasks=[]}render()};render();
</script></html>
