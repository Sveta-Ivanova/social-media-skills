<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f6f2"><title>Ежедневник</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f6f2;color:#283448;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:1800px;margin:auto;padding:22px 14px 80px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}h1{font-size:30px;margin:0}#range{color:#65758a;margin:6px 0}button{font:inherit;cursor:pointer;border:0;border-radius:13px;background:#e7edf4;color:#34547b;padding:12px 15px}button:active{opacity:.7}.nav{display:flex;gap:6px}.day{border:1px solid #dbe1e9;border-radius:20px;background:white;margin:12px 0;overflow:hidden;min-height:115px}.day.over{outline:3px solid #6b9cd1}.dayhead{display:flex;align-items:center;justify-content:space-between;background:#edf2f7;padding:12px 16px;font-weight:700}.date{font-weight:400;color:#6c7b90;margin-left:8px}.add{background:white;font-size:23px;padding:4px 13px}.items{padding:12px;min-height:65px}.empty{color:#b0b8c4;padding:9px}.task{background:#f4f6fa;border:1px solid #e1e7ee;border-radius:12px;padding:11px;margin:7px 0;display:flex;align-items:center;gap:8px;touch-action:pan-y}.task.dragging{opacity:.45}.handle{touch-action:none;cursor:grab;color:#7187a0;padding:7px;font-size:22px;user-select:none}.tasktext{flex:1;overflow-wrap:anywhere;white-space:pre-wrap}.done .tasktext{text-decoration:line-through;color:#94a0af}.check{width:22px;height:22px;accent-color:#577da7}.small{padding:6px 8px;background:transparent;color:#75859a}.hint{font-size:13px;color:#728094;margin:14px 4px}dialog{border:0;border-radius:20px;padding:22px;width:min(92vw,430px);box-shadow:0 12px 60px #0003}dialog::backdrop{background:#18243477}textarea{font:inherit;width:100%;min-height:100px;border:1px solid #ccd6e1;border-radius:12px;padding:12px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:12px}#jump{font-size:14px}#parking{margin-top:25px}
@media(min-width:900px){#days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;align-items:start}.weekgroup{background:#fffaf4;border:1px solid #e4e1db;border-radius:20px;padding:12px}.weekgroup h2{font-size:19px;margin:4px 5px 12px}.weekgroup .day{margin:7px 0;min-height:80px}.weekgroup .items{min-height:35px;padding:6px 10px}.weekgroup .dayhead{padding:7px 12px}.weekgroup .empty{padding:4px}.weekgroup .task{margin:5px 0;padding:6px}}@media(max-width:899px){.weekgroup h2{font-size:19px;margin:22px 4px 8px}header{flex-wrap:wrap}}.weekgroup{min-width:0}.tasktext{min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;cursor:pointer;line-height:1.25}.handle,.check,.small{flex-shrink:0}.dayhead>div{min-width:0}.weekgroup .day{min-width:0}@media(min-width:900px){#days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:auto repeat(7,minmax(110px,auto));gap:8px 14px;align-items:stretch}.weekgroup{display:grid;grid-template-rows:subgrid;grid-row:1 / span 8;gap:8px; padding:8px;min-width:0}.weekgroup h2{margin:4px;align-self:center}.weekgroup .day{margin:0;min-height:110px;display:flex;flex-direction:column}.weekgroup .items{flex:1;min-height:0}.weekgroup .task{min-height:48px}.weekgroup .dayhead{flex-shrink:0}.weekgroup .empty{color:#a0a9b6}}.day:has(.task) .dayhead{background:#dce9df}#board{font:inherit;font-weight:700;color:#283448;background:#e7edf4;border:0;border-radius:10px;padding:8px 12px;margin:8px 0}#board{display:none}#boards{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}#boards button{display:flex;align-items:center;gap:6px;padding:8px 11px;border:1px solid var(--tab);background:white;color:var(--tab);font-weight:600;font-size:14px}#boards svg{width:19px;height:19px;flex-shrink:0}#boards button[aria-pressed="true"]{background:var(--tab);color:white} [data-board="telegram"]{--tab:#087eaf}[data-board="instagram"]{--tab:#b62d79}[data-board="excursions"]{--tab:#387c45}[data-board="youtube"]{--tab:#c62828}[data-board="facebook"]{--tab:#2459b5}body[data-theme="telegram"]{--accent:#087eaf;--pale:#e1f2fa;--paper:#f3f9fc}body[data-theme="instagram"]{--accent:#b62d79;--pale:#f9e0ee;--paper:#fff5fa}body[data-theme="excursions"]{--accent:#387c45;--pale:#e1f0dd;--paper:#f5faf2}body[data-theme="youtube"]{--accent:#c62828;--pale:#fbe2e0;--paper:#fff6f4}body[data-theme="facebook"]{--accent:#2459b5;--pale:#e0e9fc;--paper:#f4f7ff}body[data-theme]{background:var(--paper)}body[data-theme] h1,body[data-theme] .weekgroup h2{color:var(--accent)}body[data-theme] .weekgroup{background:var(--paper);border-color:var(--pale)}body[data-theme] .day:has(.task) .dayhead{background:var(--pale);color:var(--accent)}body[data-theme] .task{border-left:3px solid var(--accent)}body[data-theme] .check{accent-color:var(--accent)}/* Muted editorial palette */body[data-theme="telegram"]{--accent:#477b91;--pale:#e4edf0;--paper:#f5f7f7}body[data-theme="instagram"]{--accent:#94677b;--pale:#eee5e9;--paper:#f8f6f5}body[data-theme="excursions"]{--accent:#647d60;--pale:#e5ebe1;--paper:#f5f7f2}body[data-theme="youtube"]{--accent:#a65d52;--pale:#f0e4df;--paper:#f9f6f3}body[data-theme="facebook"]{--accent:#526d9b;--pale:#e3e9f2;--paper:#f4f6fa}body[data-theme] .weekgroup{background:#ffffffb3;border-color:#dedfdf}body[data-theme] .task{background:#f8f9fa}body[data-theme] .dayhead{background:#f0f1f2}body[data-theme] .day:has(.task) .dayhead{background:var(--pale)}#boards [data-board="telegram"]{--tab:#477b91}#boards [data-board="instagram"]{--tab:#94677b}#boards [data-board="excursions"]{--tab:#647d60}#boards [data-board="youtube"]{--tab:#a65d52}#boards [data-board="facebook"]{--tab:#526d9b}body[data-theme="instagram"] #days{display:block}body[data-theme="instagram"] .nav,body[data-theme="instagram"] #jump,body[data-theme="instagram"] #parking,body[data-theme="instagram"] main>.hint{display:none}.feed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;max-width:690px;margin:20px auto}.feedtile{position:relative;aspect-ratio:3/4;min-width:0;border:1px dashed #cfc5ca;border-radius:8px;background:#f0edeb;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden;cursor:pointer}.feedtile.filled{background:#e7dedf;border:1px solid #cbbdc2}.feedtile:nth-child(3n+2).filled{background:#e8e4dc}.feedtile:nth-child(3n).filled{background:#e1e5e0}.feedtile .feedtext{font-size:clamp(12px,2vw,19px);font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;text-align:center}.feedtile .feedhandle{position:absolute;top:4px;left:5px;touch-action:none;cursor:grab;padding:8px;color:#68565e;font-size:21px;user-select:none}.feedtile .feednum{position:absolute;bottom:5px;right:8px;color:#82777b;font-size:11px}.feedtile.target{outline:3px solid #94677b;outline-offset:-3px}.feedtile.source{opacity:.5}.feedplus{font-size:28px;color:#a69ba0}.feednote{max-width:690px;margin:12px auto;color:#746a70;font-size:14px}@media(max-width:600px){.feed{gap:4px}.feedtile{padding:8px}.feedtile .feedhandle{padding:3px;font-size:17px}.feedtile .feedtext{-webkit-line-clamp:5}}</style><main><header><div><h1>Ежедневник</h1><select id="board" aria-label="Календарь"><option value="telegram">Телеграм</option><option value="instagram">Инстаграм</option><option value="excursions">Экскурсии</option><option value="youtube">Ютуб</option><option value="facebook">Фейсбук</option></select><nav id="boards" aria-label="Календари"><button type="button" data-board="telegram"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 21 4l-4 17-6-5-3 3 1-6 9-6-11 5z" fill="currentColor"/></svg><span>Телеграм</span></button><button type="button" data-board="instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/></svg><span>Инстаграм</span></button><button type="button" data-board="excursions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-8 7-13a7 7 0 1 0-14 0c0 5 7 13 7 13z" fill="currentColor"/><circle cx="12" cy="9" r="2.5" fill="white"/></svg><span>Экскурсии</span></button><button type="button" data-board="youtube"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" fill="currentColor"/><path d="m10 8 6 4-6 4z" fill="white"/></svg><span>Ютуб</span></button><button type="button" data-board="facebook"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 22v-9h3l.5-4H14V7c0-1 .5-2 2-2h2V2h-3c-4 0-5 2-5 5v2H7v4h3v9z" fill="currentColor"/></svg><span>Фейсбук</span></button></nav><div id="range"></div></div><div class="nav"><button id="prev" aria-label="Предыдущая неделя">‹</button><button id="today">Сегодня</button><button id="next" aria-label="Следующая неделя">›</button></div></header><button id="jump">Перейти к дате</button><input id="datepick" type="date" hidden><div id="days"></div><section class="day" id="parking"><div class="dayhead">Без даты <button class="add" data-add="none">+</button></div><div class="items" data-day="none"></div></section><p class="hint">Удерживай ⠿ и перетаскивай дела между днями любых четырёх недель. Для другой даты используй ✎.</p></main><dialog id="editor"><h2 id="editorTitle">Новое дело</h2><textarea id="entry" placeholder="Что нужно сделать?"></textarea><p>День: <select id="destination"></select></p><div class="actions"><button id="cancel">Отмена</button><button id="save">Сохранить</button></div></dialog><script>
const names=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];const months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];let board=localStorage.getItem('my-week-board')||'telegram';let key=board==='telegram'?'my-week-v1':'my-week-v1-'+board;let tasks=[];try{tasks=JSON.parse(localStorage.getItem(key)||'[]')}catch{};let week=start(new Date()),editing=null;const $=s=>document.querySelector(s);function start(d){d=new Date(d);d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d}function plus(d,n){let a=new Date(d);a.setDate(a.getDate()+n);return a}function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function fmt(d){return d.getDate()+' '+months[d.getMonth()]}function persist(){localStorage.setItem(key,JSON.stringify(tasks))}function make(tag,cls,txt){let e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function render(){document.body.dataset.theme=board;document.querySelectorAll('#boards button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.board===board)));if(board==='instagram'){renderFeed();return}let end=plus(week,27);$('#range').textContent=fmt(week)+' – '+fmt(end)+' '+end.getFullYear();let root=$('#days');root.replaceChildren();for(let w=0;w<4;w++){let group=make('section','weekgroup'),first=plus(week,w*7),last=plus(first,6);group.append(make('h2','',fmt(first)+' – '+fmt(last)));root.append(group);for(let j=0;j<7;j++){let i=w*7+j,d=plus(week,i),id=iso(d),card=make('section','day');card.dataset.day=id;let head=make('div','dayhead'),label=make('div');label.append(make('span','',names[d.getDay()]),make('span','date',fmt(d)));let add=make('button','add','+');add.onclick=()=>edit(null,id);head.append(label,add);let items=make('div','items');items.dataset.day=id;card.append(head,items);group.append(card);fill(items,id)}}fill($('#parking .items'),'none');installDrops()}function renderFeed(){const feedKey='my-week-instagram-feed-v1';let slots;try{slots=JSON.parse(localStorage.getItem(feedKey)||'null')}catch{}if(!Array.isArray(slots)){slots=Array(30).fill('');tasks.slice(0,30).forEach((t,i)=>slots[i]=t.text)}while(slots.length<30)slots.push('');const saveFeed=()=>localStorage.setItem(feedKey,JSON.stringify(slots));$('#range').textContent='План ленты · 30 публикаций';const root=$('#days');root.replaceChildren();const note=make('p','feednote','Нажми на стикер, чтобы записать тему. Удерживай ⠿, чтобы поменять публикации местами.');root.append(note);const grid=make('div','feed');root.append(grid);for(let i=0;i<30;i++){const tile=make('div','feedtile'+(slots[i]?' filled':''));tile.dataset.slot=i;tile.append(make('span',slots[i]?'feedtext':'feedplus',slots[i]||'+'),make('span','feednum',String(i+1)));tile.onclick=()=>{const d=make('dialog'),h=make('h2','','Тема публикации'),a=make('textarea');a.value=slots[i]||'';a.placeholder='Тема или идея поста';const actions=make('div','actions'),cancel=make('button','','Отмена'),save=make('button','','Сохранить');cancel.onclick=()=>d.close();save.onclick=()=>{slots[i]=a.value.trim();saveFeed();d.close();render()};actions.append(cancel,save);d.append(h,a,actions);document.body.append(d);d.addEventListener('close',()=>d.remove());d.showModal();a.focus()};if(slots[i]){const handle=make('span','feedhandle','⠿');tile.append(handle);handle.onclick=e=>e.stopPropagation();handle.onpointerdown=e=>{e.preventDefault();e.stopPropagation();handle.setPointerCapture(e.pointerId);tile.classList.add('source');let x=e.clientX,y=e.clientY,raf=0;const target=()=>document.elementFromPoint(x,y)?.closest('[data-slot]');function frame(){if(y>innerHeight-65)scrollBy(0,12);else if(y<65)scrollBy(0,-12);grid.querySelectorAll('.target').forEach(t=>t.classList.remove('target'));target()?.classList.add('target');raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame);handle.onpointermove=ev=>{x=ev.clientX;y=ev.clientY};function finish(ev,commit){cancelAnimationFrame(raf);x=ev.clientX;y=ev.clientY;const dest=target();if(commit&&dest){const j=Number(dest.dataset.slot);[slots[i],slots[j]]=[slots[j],slots[i]];saveFeed()}handle.onpointermove=null;handle.onpointerup=null;handle.onpointercancel=null;render()}handle.onpointerup=ev=>finish(ev,true);handle.onpointercancel=ev=>finish(ev,false)}}grid.append(tile)}}
function fill(root,id){root.replaceChildren();let list=tasks.filter(t=>t.day===id);if(!list.length)root.append(make('div','empty','Пока свободно'));for(let t of list){let card=make('div','task'+(t.done?' done':''));card.dataset.id=t.id;let handle=make('span','handle','⠿');handle.setAttribute('aria-label','Перетащить');let check=make('input','check');check.type='checkbox';check.checked=!!t.done;check.onchange=()=>{t.done=check.checked;persist();render()};let txt=make('span','tasktext',t.text);txt.onclick=()=>edit(t.id);txt.title=t.text;txt.setAttribute('role','button');txt.tabIndex=0;txt.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();edit(t.id)}};let btn=make('button','small','✎');btn.onclick=()=>edit(t.id);card.append(handle,check,txt,btn);root.append(card);drag(handle,card,t)}}function edit(id,day){editing=id;let t=tasks.find(t=>t.id===id);$('#editorTitle').textContent=t?'Изменить дело':'Новое дело';$('#entry').value=t?.text||'';let sel=$('#destination');sel.replaceChildren();for(let i=-28;i<=55;i++){let d=plus(week,i),o=make('option','',names[d.getDay()]+' '+fmt(d));o.value=iso(d);sel.append(o)}let o=make('option','','Без даты');o.value='none';sel.append(o);sel.value=t?.day||day||iso(new Date());if(sel.selectedIndex<0){let extra=make('option','',t.day);extra.value=t.day;sel.append(extra);sel.value=t.day}$('#editor').showModal();$('#entry').focus()}$('#save').onclick=()=>{let text=$('#entry').value.trim();if(!text)return;if(editing){let t=tasks.find(t=>t.id===editing);t.text=text;t.day=$('#destination').value}else tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),text,day:$('#destination').value,done:false});persist();$('#editor').close();render()};$('#cancel').onclick=()=>$('#editor').close();$('#parking .add').onclick=()=>edit(null,'none');$('#prev').onclick=()=>{week=plus(week,-28);render()};$('#next').onclick=()=>{week=plus(week,28);render()};$('#today').onclick=()=>{week=start(new Date());render()};$('#jump').onclick=()=>$('#datepick').showPicker?$('#datepick').showPicker():$('#datepick').click();$('#datepick').onchange=e=>{if(e.target.value){week=start(new Date(e.target.value+'T12:00:00'));render()}};let dragging=null;function drag(handle,card,t){handle.addEventListener('pointerdown',e=>{e.preventDefault();dragging={t,id:e.pointerId,handle,card};handle.setPointerCapture(e.pointerId);card.classList.add('dragging')});handle.addEventListener('pointermove',e=>{if(!dragging||dragging.id!==e.pointerId)return;let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-day]');document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));if(el)el.closest('.day')?.classList.add('over');if(e.clientY>innerHeight-75)scrollBy(0,13);if(e.clientY<75)scrollBy(0,-13)});handle.addEventListener('pointerup',e=>{if(!dragging)return;let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-day]');if(el){t.day=el.dataset.day;persist()}dragging=null;render()});handle.addEventListener('pointercancel',()=>{dragging=null;render()})}function installDrops(){}$('#board').value=board;document.querySelectorAll('#boards button').forEach(b=>b.onclick=()=>{$('#board').value=b.dataset.board;$('#board').onchange()});$('#board').onchange=()=>{board=$('#board').value;localStorage.setItem('my-week-board',board);key=board==='telegram'?'my-week-v1':'my-week-v1-'+board;try{tasks=JSON.parse(localStorage.getItem(key)||'[]')}catch{tasks=[]}render()};render();
</script></html>
